// CSN link helper: 'CSN 121.11' -> clickable badge linking to #p121
function csnLink(ref){
  if(!ref) return '';
  var m=ref.match(/CSN (\d+)/);
  if(!m) return '<span class="csn-badge">'+ref+'</span>';
  return '<a href="'+BASE_CSN+'#p'+m[1]+'" target="_blank" class="csn-badge" onclick="event.stopPropagation()">'+ref+'</a>';
}
// For compound refs like 'CSN 121.1 · CSN 121.2'
function lawBadges(refs){
  // refs = comma-separated 'KEY' or 'KEY:#p21' pairs
  var urlMap={
    RD24:{label:'RD-24-270-sn',url:BASE_RD24},
    RD25:{label:'RD-25-19-sn',url:BASE_RD25},
    ATK:{label:'Atk.lik.',url:BASE_ATK},
    MK906:{label:'MK Nr.906',url:BASE_MK906},
    DMPL:{label:'DMPL',url:BASE_DMPL}
  };
  return refs.split(',').map(function(entry){
    var parts=entry.trim().split(':');
    var key=parts[0];
    var anchor=parts.length>1?':'+parts[1]:'';
    // anchor format: ':#p21' → '#p21'
    var hash=parts.length>1?parts[1]:'';
    var r=urlMap[key];
    if(!r) return '';
    return '<a href="'+r.url+(hash?'#'+hash:'')+'" target="_blank" class="csn-badge" style="text-decoration:none" onclick="event.stopPropagation()">'+r.label+(hash?' · '+hash.replace('p',''):'')+'</a>';
  }).join('');
}

function csnLinks(refs){
  if(!refs) return '';
  return refs.split(' · ').map(csnLink).join('');
}

function sgn(svg,label){
  // Map common sign ranges to CSN appendix anchors
  var num=parseInt(label);
  var anchor='';
  if(num>=100&&num<=399) anchor='#pielikums1';  // Warning/prohibitory signs
  if(num>=400&&num<=599) anchor='#pielikums1';  // Mandatory signs
  if(num>=600&&num<=899) anchor='#pielikums1';  // Informational signs
  if(num>=900&&num<=999) anchor='#pielikums1';  // Additional signs
  return '<a class="sign-chip" href="'+BASE_CSN+anchor+'" target="_blank" onclick="event.stopPropagation()" title="Ceļa zīme '+label+' → CSN">'+svg+'<span class="sign-num">'+label+'</span></a>';
}

   parts:[
    {label:'Definition (AAL 43.)',desc:'The victim in administrative proceedings is a natural or legal person who has suffered loss or non-material harm as a result of the administrative violation, and in respect of whom an official has issued a decision granting victim status.',fineMin:'',fineMax:''},
    {label:'Rights (AAL 44.(1))',desc:'1) access to case materials, extracts and copies; 2) participate in the examination of the case; 3) use their language and a free interpreter; 4) not testify against themselves or close relatives (spouse, parents, children, siblings); 5) make requests; 6) submit evidence; 7) appeal the decision.',fineMin:'',fineMax:''},
    {label:'Duties (AAL 44.(3))',desc:'1) do everything possible to prevent or reduce the harm; 2) appear at the designated time and place; 3) provide only truthful information about all facts known regarding the violation; 4) not obstruct proceedings; 5) notify of change of address; 6) observe established order during procedural acts.',fineMin:'',fineMax:''}
   ]}},

 {article:'AAL 45. pants',anchor:'#p45',noFine:true,parts:true,signsSVG:[],srcUrl:'AAL',
  fineMax:{ru:'',lv:'',en:''},
  ru:{name:'Aizskartais mantas īpašnieks',
   parts:[
    {label:'Definīcija (AAL 45.(1))',desc:'Aizskartais mantas īpašnieks ir mantas īpašnieks vai likumīgais valdītājs, kura tiesības rīkoties ar mantu ir ierobežotas vai atņemtas administratīvā pārkāpuma procesa ietvaros un kurš nav pie atbildības saucamā persona.',fineMin:'',fineMax:''},
    {label:'Tiesības (AAL 45.(2))',desc:'1) iepazīties ar lēmumiem par rīdzību ar mantu; 2) piedalīties lietas izskatīšanā; 3) lietot valodu, kurā spēj sazināties, un bez atlīdzības izmantot tulka palīdzību; 4) izteikt lūgumus; 5) iesniegt pierādījumus; 6) pārsūdzēt lēmumu daļā par rīdzību ar mantu.',fineMin:'',fineMax:''},
    {label:'Pienākumi (AAL 45.(3))',desc:'1) noteiktā laikā ierasties un ievērot noteikto kārtību; 2) sniegt tikai patīesas liecības; 3) nekavēt un netraucēt procesa norisi; 4) paziņot par dzīvesvietas maiņu procesa laikā.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'Aizskartais mantas īpašnieks',
   parts:[
    {label:'Definīcija (AAL 45.(1))',desc:'Aizskartais mantas īpašnieks ir mantas īpašnieks vai likumīgais valdītājs, kura tiesības rīkoties ar mantu ir ierobežotas vai atņemtas administratīvā pārkāpuma procesa ietvaros un kurš nav pie atbildības saucamā persona.',fineMin:'',fineMax:''},
    {label:'Tiesības (AAL 45.(2))',desc:'1) iepazīties ar lēmumiem, kas attiecas uz rīdzību ar mantu, izdarīt no tiem izrakstus un izgatavot kopības; 2) piedalīties lietas izskatīšanā; 3) lietot valodu, kurā viņš spēj sazināties, kā arī bez atlīdzības izmantot tulka palīdzību; 4) izteikt lūgumus; 5) iesniegt pierādījumus; 6) pārsūdzēt lēmumu daļā par rīdzību ar mantu.',fineMin:'',fineMax:''},
    {label:'Pienākumi (AAL 45.(3))',desc:'1) noteiktā laikā ierasties norādītā vietā un ievērot noteikto kārtību izmeklēšanas darbību veikšanas laikā; 2) sniegt tikai patīesas liecības; 3) nekavēt un netraucēt procesa norisi; 4) paziņot par dzīvesvietas maiņu procesa laikā.',fineMin:'',fineMax:''}
   ]},
  en:{name:'Affected property owner',
   parts:[
    {label:'Definition (AAL 45.(1))',desc:'The affected property owner is the owner or lawful holder of property whose rights to dispose of the property have been restricted or removed within administrative proceedings and who is not the person held liable.',fineMin:'',fineMax:''},
    {label:'Rights (AAL 45.(2))',desc:'1) access to decisions relating to the property; 2) participate in the examination of the case; 3) use their language and a free interpreter; 4) make requests; 5) submit evidence; 6) appeal the decision in the part relating to the property.',fineMin:'',fineMax:''},
    {label:'Duties (AAL 45.(3))',desc:'1) appear at the designated time and observe established order; 2) provide only truthful testimony; 3) not obstruct proceedings; 4) notify of change of address during proceedings.',fineMin:'',fineMax:''}
   ]}},

 {article:'AAL 46.–48. pants',anchor:'#p46',noFine:true,parts:true,signsSVG:[],srcUrl:'AAL',
  fineMax:{ru:'',lv:'',en:''},
  ru:{name:'Amatpersona / Augstāka amatpersona / Tiesa',
   parts:[
    {label:'Amatpersona (AAL 46.)',desc:'Persona, kura atbilstoši normatīvajos aktos noteiktājai kompetencei veic administratīvā pārkāpuma procesu: uzsāk procesu, veic izmeklēšanas darbības, piemēro procesuālos piespiedu līdzekļus, pieņem lēmumu administratīvā pārkāpuma lietā.',fineMin:'',fineMax:''},
    {label:'Augstāka amatpersona (AAL 47.)',desc:'Persona, kura atbilstoši normatīvajos aktos noteiktājai kompetencei ir pilnvarota veikt administratīvā pārkāpuma lietā pieņemtā lēmuma tiesiskuma un pamatotības kontroli.',fineMin:'',fineMax:''},
    {label:'Tiesa (tiesnesis) (AAL 48.)',desc:'Administratīvā pārkāpuma procesā tiesa (tiesnesis) kontrolē administratīvā pārkāpuma procesa ietvaros pieņemto nolēmumu tiesiskumu un pamatotību.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'Amatpersona / Augstāka amatpersona / Tiesa',
   parts:[
    {label:'Amatpersona (AAL 46.)',desc:'Amatpersona šā likuma izpratnē ir persona, kura atbilstoši normatīvajos aktos noteiktājai kompetencei veic administratīvā pārkāpuma procesu: uzsāk administratīvā pārkāpuma procesu, veic izmeklēšanas darbības, piemēro procesuālos piespiedu līdzekļus, pieņem lēmumu administratīvā pārkāpuma lietā.',fineMin:'',fineMax:''},
    {label:'Augstāka amatpersona (AAL 47.)',desc:'Augstāka amatpersona šā likuma izpratnē ir persona, kura atbilstoši normatīvajos aktos noteiktājai kompetencei ir pilnvarota veikt administratīvā pārkāpuma lietā pieņemtā lēmuma tiesiskuma un pamatotības kontroli.',fineMin:'',fineMax:''},
    {label:'Tiesa (tiesnesis) (AAL 48.)',desc:'Administratīvā pārkāpuma procesā tiesa (tiesnesis) kontrolē administratīvā pārkāpuma procesa ietvaros pieņemto nolēmumu tiesiskumu un pamatotību.',fineMin:'',fineMax:''}
   ]},
  en:{name:'Official / Senior official / Court',
   parts:[
    {label:'Official (AAL 46.)',desc:'An official within the meaning of this Law is a person who, in accordance with their competence established by law, conducts administrative proceedings: initiates the process, conducts investigative acts, applies procedural compulsory measures, and issues a decision in the administrative case.',fineMin:'',fineMax:''},
    {label:'Senior official (AAL 47.)',desc:'A senior official is a person who, in accordance with their competence established by law, is authorised to review the lawfulness and validity of a decision issued in the administrative case.',fineMin:'',fineMax:''},
    {label:'Court / judge (AAL 48.)',desc:'In administrative proceedings, the court (judge) reviews the lawfulness and validity of decisions issued within administrative proceedings.',fineMin:'',fineMax:''}
   ]}},

 {article:'AAL 49. pants',anchor:'#p49',noFine:true,parts:true,signsSVG:[],srcUrl:'AAL',
  fineMax:{ru:'',lv:'',en:''},
  ru:{name:'Liecinieks',
   parts:[
    {label:'Definīcija (AAL 49.(1))',desc:'Liecinieks ir persona, kura uzaicināta sniegt ziņas (liecināt) par faktiem, kas jānoskaidro administratīvā pārkāpuma lietā.',fineMin:'',fineMax:''},
    {label:'Tiesības (AAL 49.(3))',desc:'Lieciniekam izskaidro tiesības atteikties no liecināšanas pret sevi, savu saderīnāto, laulāto, vecākiem, vecvecākiem, bērniem, mazbērniem, brāļiem un māsām.',fineMin:'',fineMax:''},
    {label:'Pienākumi (AAL 49.(2))',desc:'Pēc amatpersonas uzaicinājuma liecinieks ierodas norādītā vietā un laikā un sniedz liecības, paziņojot visu viņam administratīvā pārkāpuma lietā zināmo un atbildot uz jautājumiem. Brīdīnāts, ka par apzināti nepatiesu liecību vai par nepamatotu atteikšanos no liecināšanas var saukt pie kriminalātbildības.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'Liecinieks',
   parts:[
    {label:'Definīcija (AAL 49.(1))',desc:'Liecinieks ir persona, kura uzaicināta sniegt ziņas (liecināt) par faktiem, kas jānoskaidro administratīvā pārkāpuma lietā.',fineMin:'',fineMax:''},
    {label:'Tiesības (AAL 49.(3))',desc:'Lieciniekam izskaidro tiesības atteikties no liecināšanas un brīdīna, ka par apzināti nepatiesu liecību vai par nepamatotu atteikšanos no liecināšanas viņu var saukt pie kriminalātbildības. Pirms nopratināšanas liecinieks paraksta aplieciņājumu, ka viņš ir brīdīnāts par kriminalātbildību.',fineMin:'',fineMax:''},
    {label:'Pienākumi (AAL 49.(2))',desc:'Pēc amatpersonas, augstākas amatpersonas vai tiesas uzaicinājuma ierodas norādītā vietā un laikā un sniedz liecības, paziņojot visu viņam zināmo un atbildot uz jautājumiem.',fineMin:'',fineMax:''}
   ]},
  en:{name:'Witness',
   parts:[
    {label:'Definition (AAL 49.(1))',desc:'A witness is a person who has been summoned to provide information (testify) about facts to be established in the administrative case.',fineMin:'',fineMax:''},
    {label:'Rights (AAL 49.(3))',desc:'The witness is informed of the right to refuse to testify against themselves or close relatives (spouse, parents, grandparents, children, grandchildren, siblings). They are warned that deliberately false testimony or unjustified refusal to testify may result in criminal liability.',fineMin:'',fineMax:''},
    {label:'Duties (AAL 49.(2))',desc:'Upon summons from an official, senior official or court, the witness appears at the designated time and place and testifies, reporting everything known in the case and answering questions.',fineMin:'',fineMax:''}
   ]}}
],

  en:{name:'Administrative violation',desc:'An administrative violation is an unlawful, culpable act (action or omission) of a person for which administrative liability is provided in a law or municipal binding regulations.'}},

 {article:'AAL 14. pants',anchor:'#p14',noFine:true,parts:true,signsSVG:[],srcUrl:'AAL',

 {article:'AAL 20.–21. pants',anchor:'#p20',noFine:true,parts:true,signsSVG:[],srcUrl:'AAL',
  fineMax:{ru:'',lv:'',en:''},
  ru:{name:'Apstākļi, kas mīkstinoš.ie un pastiprinošie apstākļi',
   parts:[
    {label:'Atbildību mīkstinošie apstākļi (AAL 20.)',desc:'1) atzīst un nožēlo izdarīto; 2) labprātīgī atlīdzipījis zaudējumu vai novērsis kaitējumu; 3) pārkāpums izdarīts stipra psihiska uzbudinājuma vai smagu pers. apstākļu dēļ; 4) labprātīgī pieteicies pirms atklāšanas; 5) cietā prettiesiskas uzvedības ietekmē; 6) grūtniecības stāvoklī vai bērns līdz 1 gadam.',fineMin:'',fineMax:''},
    {label:'Atbildību pastiprinošie apstākļi (AAL 21.)',desc:'1) turpināts, neraugoties uz prasību izbeigt; 2) iesaistījis nepilngadīgo; 3) izdarīts stihiskas nelaimces apstākļos; 4) izdarīts alkohola vai narkotiku ietekmē; 5) motīvs ir naids pret personas iezīmēm; 6) izdarījusi personu grupa.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'Atbildību mīkstinošie un pastiprinošie apstākļi',
   parts:[
    {label:'Mīkstināošie apstākļi (AAL 20.)',desc:'1) atzīnis un nožēlojis izdarīto; 2) labprātīgī atlīdzipājis zaudējumu vai novērsis kaitējumu; 3) pārkāpums izdarīts stipra psihiska uzbudinājuma ietekmē vai smagu pers. apstākļu dēļ; 4) labprātīgī pieteicies pirms pārkāpuma atklāšanas; 5) cietā prettiesiskas vai amorālas uzvedības ietekmē; 6) sieviete grūtniecības stāvoklī vai ar bērnu līdz 1 gadam.',fineMin:'',fineMax:''},
    {label:'Pastiprinājošie apstākļi (AAL 21.)',desc:'1) turpināta prettiesiskā rīdzība, neraugoties uz pilnvarotas amatpersonas prasību to izbeigt; 2) pilngadīga persona iesaistījusi nepilngadīgo; 3) izdarīts stihiskas nelaimces vai ārkārtējos apstākļos; 4) izdarīts alkohola, narkotiku vai citu ap. vielu ietekmē; 5) motīvs ir naids pret personas iezīmēm; 6) izdarījusi personu grupa.',fineMin:'',fineMax:''}
   ]},
  en:{name:'Mitigating and aggravating circumstances',
   parts:[
    {label:'Mitigating circumstances (AAL 20.)',desc:'1) admitted and regretted the violation; 2) voluntarily compensated the loss or remedied the harm; 3) committed under strong emotional distress or difficult personal circumstances; 4) voluntarily came forward before discovery; 5) influenced by the victim\u0027s unlawful conduct; 6) pregnant woman or woman with a child under 1 year.',fineMin:'',fineMax:''},
    {label:'Aggravating circumstances (AAL 21.)',desc:'1) unlawful conduct continued despite a demand to stop; 2) involved a minor in the commission; 3) committed during a natural disaster or extraordinary circumstances; 4) committed under influence of alcohol or drugs; 5) motivated by hatred of personal characteristics; 6) committed by a group of persons.',fineMin:'',fineMax:''}
   ]}},

 {article:'AAL 27.–36. pants',anchor:'#p27',noFine:true,parts:true,signsSVG:[],srcUrl:'AAL',
  fineMax:{ru:'',lv:'',en:''},
  ru:{name:'Pamatprincip i proceša',
   parts:[
    {label:'Nevainīguma prezumpcija (AAL 29.)',desc:'Persona netiek uzkatīta par vainīgu administratīvā pārkāpuma izdarīšanā, kamēr tās vaina nav pierādīta. Personai nav jāpierāda savs nevainīgums. Visas saprātīgās šaubas, ja tās nevar novērst, vērtē par labu personai.',fineMin:'',fineMax:''},
    {label:'Tiesības uz aizstāvību (AAL 33.)',desc:'Pie atbildības saucamajai personai ir tiesības uz aizstāvību, proti, tiesības zināt, kādā pārkāpuma izdarīšanā to tur aizdomās, un izvēlēties savu aizstāvības pozīciju.',fineMin:'',fineMax:''},
    {label:'Nevainīguma prezumpcija piemērošana praksē',desc:'Amatpersonai ir pienākums pierādīt pārkāpuma faktu, nevis personai — savu nevainīgumu. Šī principa pārkāpšana var but pamats lēmuma atcelšanai.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'Procesa pamatprincipi',
   parts:[
    {label:'Nevainīguma prezumpcija (AAL 29.)',desc:'Persona netiek uzkatīta par vainīgu administratīvā pārkāpuma izdarīšanā, kamēr tās vaina nav pierādīta. Personai nav jāpierāda savs nevainīgums. Visas saprātīgās šaubas par vainu, ja tās nevar novērst ar pierādījumu pārbaudi, vērtē par labu personai.',fineMin:'',fineMax:''},
    {label:'Tiesības uz aizstāvību (AAL 33.)',desc:'Pie atbildības saucamajai personai ir tiesības uz aizstāvību, proti, tiesības zināt, kādā pārkāpuma izdarīšanā to tur aizdomās, un izvēlēties savu aizstāvības pozīciju. Aizstāvību persona var īstenot pati, ar aizstāvja līdzdalību vai pārstāvja starpniecībā.',fineMin:'',fineMax:''},
    {label:'Tiesības uz atlīdzīnājumu (AAL 34.)',desc:'Personai, kurai ar administratīvā pārkāpuma processā veicamu publisko tiesību juridiskās personas rīdzību nodarīts kaitējums, ir tiesības uz atlīdzīnājumu saskaņā ar normatīvajiem aktiem.',fineMin:'',fineMax:''}
   ]},
  en:{name:'Basic principles of proceedings',
   parts:[
    {label:'Presumption of innocence (AAL 29.)',desc:'A person is not considered guilty of committing an administrative violation until their guilt has been proven. The person is not required to prove their innocence. All reasonable doubts about guilt, if they cannot be resolved by examining evidence, shall be interpreted in favour of the person.',fineMin:'',fineMax:''},
    {label:'Right to defence (AAL 33.)',desc:'The person held liable has the right to a defence — the right to know what violation they are suspected of and to choose their defence position. The right may be exercised personally, through a defender, or through a representative.',fineMin:'',fineMax:''},
    {label:'Right to redress (AAL 34.)',desc:'A person who has suffered harm as a result of actions by a public legal entity in administrative proceedings has the right to compensation in accordance with applicable law.',fineMin:'',fineMax:''}
   ]}}
],

pienakumi:[

  ru:{name:'LPP 9. Основной принцип — действовать в любое время и в любом месте',desc:'Jebkura policijas darbinieka pienākums ir visā Latvijas Republikas teritorijā neatkarīgi no ieņemamā amata, atrašanās vietas un laika — gadījumā, ja pie viņa griežas personas ar pieteikumu vai ziņojumu par notikumu, kurš apdraud personu un sabiedrības drošību, kā arī pašam konstatējot tādu notikumu — veikt iespējamos pasākumus, lai novērstu likumpārkāpumu, glābtu cilvēkus un sniegtu viņiem palīdzību, konstatētu likumpārkāpušās personas, apsargātu notikuma vietu un paziņotu tuvākajai policijas iestādei.'},
  lv:{name:'LPP 9. Policijas darbinieka pamatprincips — rīkoties jebkurā laikā un vietā',desc:'Jebkura policijas darbinieka pienākums ir visā Latvijas Republikas teritorijā neatkarīgi no ieņemamā amata, atrašanās vietas un laika — gadījumā, ja pie viņa griežas personas ar pieteikumu vai ziņojumu par notikumu, kurš apdraud personu un sabiedrības drošību, kā arī pašam konstatējot tādu notikumu — veikt iespējamos pasākumus, lai novērstu likumpārkāpumu, glābtu cilvēkus un sniegtu viņiem palīdzību, konstatētu likumpārkāpušās personas, apsargātu notikuma vietu un paziņotu tuvākajai policijas iestādei.'},
  en:{name:'LPP 9. Basic principle — act at any time and place',desc:'It is the duty of every police officer throughout the territory of the Republic of Latvia, regardless of position, location or time — when persons approach with a report of an incident threatening personal or public safety, or when discovering such an incident themselves — to take all possible measures to prevent the violation, save people, assist them, identify perpetrators, secure the scene and notify the nearest police authority.'}},

  en:{name:'LPP 10. Basic duties of a police officer',

    {label:'Maintaining order (10.1)',desc:'Maintain order on roads, streets, squares, parks, public transport, airports, ports, stations and other public places to guarantee personal and public safety.',fineMin:'',fineMax:''},
    {label:'Registration and response (10.2)',desc:'Register information about crimes, violations and their perpetrators, and about events threatening public safety, and respond immediately. Report accidents, fires, disasters and other threats.',fineMin:'',fineMax:''},
    {label:'Emergency assistance (10.3)',desc:'Provide medical and other emergency assistance to persons who have suffered from violations, accidents or are in a helpless state, including those who have lost the ability to move independently or may cause harm to others due to intoxication.',fineMin:'',fineMax:''},
    {label:'Preventing and detecting violations (10.4–10.6)',desc:'Conduct inquiry; carry out operational search measures; detect, stop and prevent crimes; search for persons hiding from justice; prevent and stop administrative violations, compile protocols.',fineMin:'',fineMax:''},

   ]}},

    {label:'12.3. Izsaukums uz policijas iestādi',desc:'Izsaukt uz policijas iestādi jebkuru personu sakarā ar lietām un materiāliem, kuru izskatīšana ir policijas kompetencē. Ja personas bez attaisnojoša iemesla neierodas pēc izsaukuma — likumā noteiktajā kārtībā veikt to piespiedu atvešanu.',fineMin:'',fineMax:''},
    {label:'12.4. Protokoli un administratīvā aizturēšana',desc:'Sastādīt protokolus par administratīvajiem pārkāpumiem. Likumā paredzētajos gadījumos nogādāt policijas iestādē likumpārkāpējus, izdarīt personas apskati, mantu un dokumentu izņemšanu, administratīvi aizturēt likumpārkāpējus.',fineMin:'',fineMax:''},
    {label:'12.7. Aizturēšana aizdomu gadījumā',desc:'Likumā noteiktajā kārtībā aizturēt un turēt apsardzībā personas, kuras tiek turētas aizdomās par noziegumu vai administratīvā pārkāpuma izdarīšanu.',fineMin:'',fineMax:''},
    {label:'12.8. Nepilngadīgo aizturēšana',desc:'Aizturēt personas vecumā līdz 16 gadiem, kuras patvaļīgi pametušas dzīvesvietu vai bērnu iestādi, un turēt tās policijas iestādē līdz nodošanai vecākiem vai bērnu iestādēm.',fineMin:'',fineMax:''},
    {label:'12.9. Intoksikētu personu nogādāšana',desc:'Nogādāt medicīnas iestādēs vai mājoklī personas, kuras alkohola, toksisko vai narkotisko vielu lietošanas rezultātā zaudējušas spēju patstāvīgi pārvietoties vai orientēties vai var nodarīt kaitējumu apkārtējiem vai pašas sev. Ja tas nav iespējams — nogādāt policijas iestādē līdz atskurbšanai, bet ne ilgāk par 12 stundām.',fineMin:'',fineMax:''},
    {label:'12.10. Intoksikētu personu aizturēšana mājoklī',desc:'Aizturēt uz rakstveida pieteikuma pamata personas, kuras atrodas mājoklī alkohola vai narkotiku reibuma stāvoklī un var nodarīt kaitējumu sev vai apkārtējiem, ja apkārtējie baidās palikt vienatnē ar šo personu. Uzturēt medicīnas vai policijas iestādē līdz atskurbšanai.',fineMin:'',fineMax:''},
    {label:'12.11. Psihiski traucētas personas',desc:'Aizturēt personas, kurām ir nepārprotami psihiski traucējumi un kuras ar savām darbībām rada acīmredzamas briesmas sev vai apkārtējiem, un uzturēt tās policijas iestādē līdz nodošanai ārstnieciskajai iestādei vai nogādāšanai mājoklī.',fineMin:'',fineMax:''},
    {label:'12.16. Iekļūšana telpās',desc:'Jebkurā diennakts laikā iekļūt dzīvoklī bez tajā dzīvojošo atļaujas (ja nepieciešams, lietojot fizisku spēku), ja persona aizturama nozieguma vietā vai apdraudēta citu personu dzīvība. Par katru šādu iekļūšanu 24 stundu laikā rakstveidā jāziņo prokuroram.',fineMin:'',fineMax:''},
    {label:'12.17. Alkohola pārbaude',desc:'Likumā noteiktajos gadījumos apsekot personas, lai konstatētu, vai tās ir lietojušas alkoholu, toksiskās vai narkotiskās vielas, vai nosūtīt tās apsekošanai uz medicīnas iestādēm.',fineMin:'',fineMax:''},
    {label:'12.20. Transportlīdzekļa apturēšana un vadītāja atstādināšana',desc:'Apturēt transportlīdzekli un izdarīt tā apskati, ja ir pamats domāt, ka vadītājs pārkāpis ceļu satiksmes noteikumus. Atstādināt no vadīšanas personas ar alkohola, toksisko vai narkotisko vielu lietošanas pazīmēm vai bez dokumentiem.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'LPP 12. Policijas darbinieka vispārējās tiesības',
   parts:[
    {label:'12.1–12.2. Dokumentu pārbaude un prasības izpilde',desc:'Prasīt, lai personas pārtrauc likumpārkāpumus. Pārbaudīt personām, kuras tiek turētas aizdomās par likumpārkāpumu, personību apliecinošos dokumentus un citus dokumentus, kas nepieciešami tiesību normu ievērošanas pārbaudei.',fineMin:'',fineMax:''},
    {label:'12.3. Izsaukums uz policijas iestādi',desc:'Izsaukt uz policijas iestādi jebkuru personu sakarā ar lietām un materiāliem, kuru izskatīšana ir policijas kompetencē. Ja personas bez attaisnojoša iemesla neierodas pēc izsaukuma — likumā noteiktajā kārtībā veikt to piespiedu atvešanu.',fineMin:'',fineMax:''},
    {label:'12.4. Protokoli un administratīvā aizturēšana',desc:'Sastādīt protokolus par administratīvajiem pārkāpumiem. Likumā paredzētajos gadījumos nogādāt policijas iestādē likumpārkāpējus, izdarīt personas apskati, mantu un dokumentu izņemšanu un apskati, administratīvi aizturēt likumpārkāpējus un piemērot administratīvos sodus.',fineMin:'',fineMax:''},
    {label:'12.7. Aizturēšana aizdomu gadījumā',desc:'Likumā noteiktajā kārtībā aizturēt un turēt apsardzībā personas, kuras tiek turētas aizdomās par noziegumu vai administratīvā pārkāpuma izdarīšanu.',fineMin:'',fineMax:''},
    {label:'12.8. Nepilngadīgo aizturēšana',desc:'Aizturēt personas vecumā līdz 16 gadiem, kuras patvaļīgi pametušas dzīvesvietu vai bērnu iestādi, un turēt tās policijas iestādē līdz nodošanai vecākiem, viņu aizstājējiem vai bērnu iestādēm.',fineMin:'',fineMax:''},
    {label:'12.9. Intoksikētu personu nogādāšana (LPP 12.1.9)',desc:'Nogādāt medicīnas iestādēs vai mājoklī personas, kuras alkohola, toksisko vai narkotisko vielu lietošanas rezultātā zaudējušas spēju patstāvīgi pārvietoties vai orientēties vai var nodarīt kaitējumu apkārtējiem vai pašas sev. Ja tas nav iespējams — nogādāt policijas iestādē līdz atskurbšanai, bet ne ilgāk par 12 stundām.',fineMin:'',fineMax:''},
    {label:'12.10. Intoksikētu personu aizturēšana mājoklī',desc:'Aizturēt uz rakstveida pieteikuma pamata personas, kuras atrodas mājoklī alkohola vai narkotiku reibuma stāvoklī un var nodarīt kaitējumu sev vai apkārtējiem, ja apkārtējie baidās palikt vienatnē ar šo personu. Uzturēt medicīnas vai policijas iestādē līdz atskurbšanai vai apstākļu noskaidrošanai.',fineMin:'',fineMax:''},
    {label:'12.11. Psihiski traucētas personas',desc:'Aizturēt personas, kurām ir nepārprotami psihiski traucējumi un kuras ar savām darbībām rada acīmredzamas briesmas sev vai apkārtējiem, un uzturēt tās policijas iestādē līdz nodošanai ārstnieciskajai iestādei vai nogādāšanai mājoklī.',fineMin:'',fineMax:''},
    {label:'12.16. Iekļūšana telpās',desc:'Jebkurā diennakts laikā iekļūt dzīvoklī bez tajā dzīvojošo atļaujas (ja nepieciešams, lietojot fizisku spēku), ja persona aizturama nozieguma vietā vai apdraudēta citu personu dzīvība. Par katru šādu iekļūšanu 24 stundu laikā rakstveidā jāziņo prokuroram.',fineMin:'',fineMax:''},
    {label:'12.17. Alkohola un narkotiku pārbaude',desc:'Likumā noteiktajos gadījumos apsekot personas, lai konstatētu, vai tās ir lietojušas alkoholu, toksiskās vai narkotiskās vielas, vai nosūtīt tās apsekošanai uz medicīnas iestādēm, ja atzinums nepieciešams likumpārkāpuma fakta apstiprināšanai.',fineMin:'',fineMax:''},
    {label:'12.20. Transportlīdzekļa apturēšana un atstādināšana',desc:'Apturēt transportlīdzekli un izdarīt tā apskati, ja ir pamats domāt, ka vadītājs pārkāpis ceļu satiksmes noteikumus. Aizliegt lietot transportlīdzekļus, kuru tehniskais stāvoklis apdraud kustības drošību. Atstādināt no vadīšanas personas ar alkohola vai narkotiku pazīmēm vai bez dokumentiem.',fineMin:'',fineMax:''}
   ]},
  en:{name:'LPP 12. General rights of a police officer',
   parts:[
    {label:'12.1–12.2. Document checks and compliance demands',desc:'Require persons to stop violations. Check identity documents and other relevant documents of persons suspected of violations in areas under police supervision.',fineMin:'',fineMax:''},
    {label:'12.3. Summoning to police station',desc:'Summon any person to the police station in matters within police competence. If they fail to appear without justification, compulsory escorting may be carried out as established by law.',fineMin:'',fineMax:''},
    {label:'12.4. Protocols and administrative detention',desc:'Compile administrative violation protocols. In cases provided by law, bring violators to the police station, conduct body searches, seize documents and property, administratively detain violators and apply administrative penalties.',fineMin:'',fineMax:''},
    {label:'12.7. Detention on suspicion',desc:'Detain and hold persons suspected of committing a crime or administrative violation as established by law.',fineMin:'',fineMax:''},
    {label:'12.8. Detention of minors',desc:'Detain persons under 16 who have voluntarily left their home or a children’s institution, and hold them at the police station until handed over to parents or a children’s institution.',fineMin:'',fineMax:''},
    {label:'12.9. Transportation of intoxicated persons (LPP 12.1.9)',desc:'Transport to medical facilities or home persons who, due to alcohol, toxic or narcotic substance use, have lost the ability to move or orientate independently, or may cause harm to others or themselves. If not possible, bring to police station until sober, up to 12 hours.',fineMin:'',fineMax:''},
    {label:'12.10. Detention of intoxicated persons at home',desc:'Detain based on written application persons who are in their home in a state of intoxication and may cause harm to themselves or others, if those nearby are afraid to be left alone with them. Hold at medical or police facility until sober.',fineMin:'',fineMax:''},
    {label:'12.11. Persons with mental disorders',desc:'Detain persons with evident mental disorders who pose obvious danger to themselves or others, and hold them at the police station until transfer to a medical institution or return home.',fineMin:'',fineMax:''},
    {label:'12.16. Entry onto premises',desc:'Enter a dwelling at any time without the occupants’ permission (using force if necessary) when a person is to be detained at the scene of a crime or another person’s life is threatened. Such entry must be reported in writing to the prosecutor within 24 hours.',fineMin:'',fineMax:''},
    {label:'12.17. Alcohol and drug testing',desc:'In cases established by law, examine persons to determine whether they have consumed alcohol, toxic or narcotic substances, or send them for examination to medical facilities when an opinion is needed to confirm a violation.',fineMin:'',fineMax:''},
    {label:'12.20. Vehicle stop and driver suspension',desc:'Stop a vehicle and inspect it if there are grounds to believe the driver has violated traffic rules. Prohibit use of vehicles whose technical condition endangers traffic safety. Suspend from driving persons with signs of alcohol or drug use or without the required documents.',fineMin:'',fineMax:''}
   ]}}
],

  ru:{name:'LPP 13. Физическая сила и специальные средства',
   parts:[
    {label:'Speciālie līdzekļi — saraksts',desc:'Policijas darbiniekam ir tiesības lietot fizisku spēku, speciālos cīņas paņēmienus, roku dzelžus, durkļus, dunčus, stekus, asaras izraisošas vielas, speciālas krāsvielas, psiholoģiskas iedarbības gaismas un skaņu ierīces, ierīces telpu atvēršanai, šķēršļu sagraušanas un transporta apstādināšanas līdzekļus, ūdensmetējus, bruņumašīnas, helikopterus, dienesta suņus un zirgus.',fineMin:'',fineMax:''},
    {label:'Pamati spēka pielietošanai (13.1–13.6)',desc:'Spēks lietojams, lai: 1) atvairītu uzbrukumu personām vai policistiem; 2) atvairītu uzbrukumu ēkām un transportlīdzekļiem vai atbrīvotu to; 3) atbrīvotu ķīlniekus; 4) novērstu masu nekārtības; 5) aizturētu un konvojētu likumpārkāpējus; 6) pārtrauktu ļaunprātīgu nepakļaušanos likumīgām prasībām.',fineMin:'',fineMax:''},
    {label:'Proporcionalitāte un medicīniskā palīdzība',desc:'Speciālo līdzekļu veidu un fiziska spēka intensitāti nosaka, ņemot vērā konkrēto situāciju, pārkāpuma raksturu un pārkāpēja individuālās iezīmes, maksimāli ierobežojot nodarīto kaitējumu. Ja ir cietušie — nekavējoties sniegt medicīnisko palīdzību un ziņot prokuroram.',fineMin:'',fineMax:''},
    {label:'Aizliegumi — sievietes, invalīdi, mazgadīgie',desc:'Aizliegts lietot speciālos cīņas paņēmienus, roku dzelžus, stekus un dienesta suņus pret sievietēm, personām ar redzamām invaliditātes pazīmēm un mazgadīgām personām, izņemot gadījumus, kad tās izdara grupveida uzbrukumu vai izrāda bruņotu pretošanos.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'LPP 13. Fizisks spēks un speciālie līdzekļi',

    {label:'Speciālie līdzekļi — saraksts',desc:'Policijas darbiniekam ir tiesības lietot fizisku spēku, speciālos cīņas paņēmienus, roku dzelžus, stekus, asaras izraisošas vielas, speciālas krāsvielas, psiholoģiskas iedarbības ierīces, ierīces telpu atvēršanai, šķēršļu sagraušanas un transporta apstādināšanas līdzekļus, ūdensmetējus, bruņumašīnas, helikopterus, dienesta suņus un zirgus.',fineMin:'',fineMax:''},

   ]},
  en:{name:'LPP 13. Physical force and special means',
   parts:[
    {label:'Special means — list',desc:'A police officer has the right to use physical force, special combat techniques, handcuffs, batons, tear-causing substances, special colouring agents, psychological impact devices, door-opening devices, barrier-breaking and vehicle stop means, water cannons, armoured vehicles, helicopters, service dogs and horses.',fineMin:'',fineMax:''},
    {label:'Grounds for use of force (13.1–13.6)',desc:'Force may be used to: 1) repel attacks on persons or officers; 2) repel attacks on buildings or vehicles or to free them; 3) free hostages; 4) prevent mass disorder; 5) detain and escort violators; 6) stop malicious non-compliance with lawful demands.',fineMin:'',fineMax:''},
    {label:'Proportionality and medical assistance',desc:'The type and intensity of special means and force are determined by the specific situation, the nature of the violation and the individual characteristics of the offender, minimising harm caused. If there are casualties — immediately provide medical assistance and report to the prosecutor.',fineMin:'',fineMax:''},
    {label:'Prohibitions — women, disabled persons, minors',desc:'Prohibited from using special combat techniques, handcuffs, batons and service dogs against women, persons with visible signs of disability and minors, except when they carry out group attacks or offer armed resistance.',fineMin:'',fineMax:''}
   ]}},

 {article:'LPP 14. pants',anchor:'#p14',noFine:true,parts:true,signsSVG:[],srcUrl:'LPP',
  fineMax:{ru:'',lv:'',en:''},
  ru:{name:'LPP 14. Огнестрельное оружие — право на применение',
   parts:[
    {label:'Pamati (14.1–14.7)',desc:'Policijas darbinieks ir tiesīgs pielietot šaujamieroci galējas nepieciešamības situācijā, lai: 1) aizsargātu sevi vai citus no uzbrukuma, kas reāli apdraud dzīvību; 2) atbrīvotu ķīlniekus; 3) atvairītu grupveida vai bruņotu uzbrukumu policistiem; 4) atvairītu uzbrukumu apsargājamiem objektiem; 5) aizturētu personu, kas izrāda bruņotu pretošanos vai pārsteigta smaga nozieguma izdarīšanā; 6) apturētu transportlīdzekli, ja vadītājs rada draudus dzīvībai; 7) padarītu nekaitīgu dzīvnieku, kurš apdraud cilvēku.',fineMin:'',fineMax:''},
    {label:'Brīdinājuma prasība',desc:'Pirms šaujamieroča pielietošanas ir jābrīdina par nodomu to darīt. Ja nepieciešams, var izdarīt arī brīdinājuma šāvienu.',fineMin:'',fineMax:''},
    {label:'Bez brīdinājuma — izņēmumi',desc:'Bez brīdinājuma šaujamieroci var pielietot, ja: uzbrukums ir pēkšņs vai tiek izmantoti ieroči vai transportlīdzekļi; tas nepieciešams ķīlnieku atbrīvošanai; notiek bēgšana no apcietinājuma, pielietojot ieroci vai izmantojot transportlīdzekli braukšanas laikā.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'LPP 14. Šaujamierocis — pielietošanas tiesības',
   parts:[
    {label:'Pamati (14.1–14.7)',desc:'Policijas darbinieks ir tiesīgs pielietot šaujamieroci galējas nepieciešamības situācijā, lai: 1) aizsargātu sevi vai citus no uzbrukuma, kas reāli apdraud dzīvību; 2) atbrīvotu ķīlniekus; 3) atvairītu grupveida vai bruņotu uzbrukumu policistiem; 4) atvairītu uzbrukumu apsargājamiem objektiem; 5) aizturētu personu, kas izrāda bruņotu pretošanos vai pārsteigta smaga nozieguma vietā; 6) apturētu transportlīdzekli, ja vadītājs rada draudus dzīvībai; 7) padarītu nekaitīgu dzīvnieku, kas apdraud cilvēku.',fineMin:'',fineMax:''},
    {label:'Brīdinājuma prasība',desc:'Pirms šaujamieroča pielietošanas ir jābrīdina par nodomu to darīt. Ja nepieciešams, var izdarīt arī brīdinājuma šāvienu.',fineMin:'',fineMax:''},
    {label:'Bez brīdinājuma — izņēmumi',desc:'Bez brīdinājuma šaujamieroci var pielietot, ja: uzbrukums ir pēkšņs vai tiek izmantoti ieroči vai mehāniskie transportlīdzekļi; tas nepieciešams ķīlnieku atbrīvošanai; notiek bēgšana no apcietinājuma, pielietojot ieroci vai izmantojot transportlīdzekli tā braukšanas laikā.',fineMin:'',fineMax:''}
   ]},
  en:{name:'LPP 14. Firearm — right to use',
   parts:[
    {label:'Grounds (14.1–14.7)',desc:'A police officer is entitled to use a firearm in situations of extreme necessity to: 1) protect themselves or others from an attack genuinely threatening life; 2) free hostages; 3) repel group or armed attacks on officers; 4) repel attacks on guarded facilities; 5) detain a person offering armed resistance or caught at the scene of a serious crime; 6) stop a vehicle if the driver poses a real threat to life; 7) render an animal harmless that threatens a person.',fineMin:'',fineMax:''},
    {label:'Warning requirement',desc:'Before using a firearm, a warning of intent must be given. If necessary, a warning shot may also be fired.',fineMin:'',fineMax:''},
    {label:'Without warning — exceptions',desc:'A firearm may be used without warning if: the attack is sudden or weapons or vehicles are used; it is necessary to free hostages; a person is escaping from custody using a weapon or vehicle while it is moving.',fineMin:'',fineMax:''}
   ]}}
],

aizstav:[
 {article:'LPP 15. pants',anchor:'#p15',noFine:true,parts:true,signsSVG:[],srcUrl:'LPP',
  fineMax:{ru:'',lv:'',en:''},
  ru:{name:'LPP 15. Правовая защита сотрудника полиции',
   parts:[
    {label:'Неприкосновенность при исполнении обязанностей',desc:'Полицейский сотрудник находится под защитой закона при исполнении служебных обязанностей. Препятствие законным действиям полиции недопустимо. Никто не вправе требовать от полицейского сотрудника действий вопреки закону.',fineMin:'',fineMax:''},
    {label:'Защита чести и достоинства',desc:'Честь и достоинство сотрудника полиции находятся под защитой закона. Оскорбление сотрудника полиции при исполнении служебных обязанностей может влечь привлечение к ответственности.',fineMin:'',fineMax:''},
    {label:'Ответственность за незаконные приказы',desc:'Сотрудник полиции не несёт ответственность за выполнение противоправных приказов. Если полицейскому сотруднику отдан явно незаконный приказ, он обязан сообщить об этом вышестоящему начальнику.',fineMin:'',fineMax:''}
   ]},
  lv:{name:'LPP 15. Policijas darbinieka tiesīskā aizstāvība',
   parts:[
    {label:'Neaizskaramiba pie pienākumu pildīšanas',desc:'Policijas darbinieks, pildot dienesta pienākumus, atrodas likuma aizsardzībā. Likumīgās policijas darbinieka rīdzības traucēšana un viņa apdraudēšana nav pielāujama.',fineMin:'',fineMax:''},
    {label:'Gods un cienība',desc:'Policijas darbinieka gods un cienība atrodas likuma aizsardzībā. Policijas darbinieka apvāinošana, pieņemot vai pildot dienesta pienākumus, var rastināt kriminalātbildību.',fineMin:'',fineMax:''},
    {label:'Atbildība par neleglāliem rīkojumiem',desc:'Policijas darbinieks neuznēmas atbildību par nelikumīgu rīkojumu izpildi. Ja rīkojums ir acimredzami nelikumīgs, policijas darbinieks par to paziņo augstākai amatpersonai.',fineMin:'',fineMax:''}
   ]},
  en:{name:'LPP 15. Legal protection of a police officer',
   parts:[
    {label:'Inviolability when performing duties',desc:'A police officer performing their duties is protected by law. Interference with the lawful actions of a police officer and threatening them is not permitted.',fineMin:'',fineMax:''},

let protoType=null;
let protoChecked={};
let showingProto=false;

function showProtocol(btn){
  showingProto=true;
  showingFavs=false;
  document.querySelectorAll('.law-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('appSubtitle').textContent={lv:'Protokola palīgs',ru:'Помощник протокола',en:'Protocol helper'}[lang];
  document.getElementById('appSubtitle2').textContent={lv:'Soli pa solim',ru:'Шаг за шагом',en:'Step by step'}[lang];
  protoType=null; protoChecked={};
  renderProtocol();
}

function selectProtoType(id){
  protoType=id; protoChecked={};
  renderProtocol();
}

function toggleProtoStep(id){
  protoChecked[id]=!protoChecked[id];
  renderProtocol();
}

function resetProto(){
  protoChecked={};
  renderProtocol();
}

function renderProtocol(){
  var cats=document.getElementById('catGrid');
  var sec=document.getElementById('sectionTitle');
  var list=document.getElementById('lawsList');
  if(cats){cats.innerHTML='';cats.style.display='none';}
  if(sec) sec.textContent='';
  if(!list) return;

  var labels={
    lv:{selectType:'Izvēlies pārkāpuma veidu',checklist:'Darbību saraksts',mandatory:'Obligāts',
        progress:'Izpildīts',reset:'Sākt no sākuma',done:'Protokols gatavs!',doneSub:'Pārbaud visus obligātos soļus pirms nodod.'},
    ru:{selectType:'Выбери тип нарушения',checklist:'Список действий',mandatory:'Обязательно',
        progress:'Выполнено',reset:'Начать заново',done:'Протокол готов!',doneSub:'Проверь все обязательные шаги перед сдачей.'},
    en:{selectType:'Select violation type',checklist:'Action checklist',mandatory:'Required',
        progress:'Completed',reset:'Start over',done:'Protocol complete!',doneSub:'Review all mandatory steps before submitting.'}
  }[lang]||{};

  if(!protoType){
    // Show type selector
    list.innerHTML='<div class="proto-container">'+
      '<div class="proto-header">'+labels.selectType+'</div>'+
      '<div class="proto-types">'+
      PROTO_TYPES.map(function(t){
        var info=t[lang]||t.lv;
        return '<button class="proto-type-btn" onclick="selectProtoType(\''+t.id+'\')">'+
          '<span class="proto-type-icon">'+t.icon+'</span>'+
          '<div class="proto-type-name">'+info.name+'</div>'+
          '<div class="proto-type-sub">'+info.sub+'</div>'+
          '</button>';
      }).join('')+
      '</div></div>';
    return;
  }

  var steps=PROTO_STEPS[protoType];
  var langSteps=steps?(steps[lang]||steps.lv):[];
  var total=langSteps.length;
  var done=langSteps.filter(function(s){return protoChecked[s.s];}).length;
  var mandatoryTotal=langSteps.filter(function(s){return s.mandatory;}).length;
  var mandatoryDone=langSteps.filter(function(s){return s.mandatory&&protoChecked[s.s];}).length;
  var pct=total>0?Math.round(done/total*100):0;
  var allMandatoryDone=mandatoryDone===mandatoryTotal;
  var typeInfo=PROTO_TYPES.find(function(t){return t.id===protoType;});
  var typeName=typeInfo?(typeInfo[lang]||typeInfo.lv).name:'';

  var stepsHtml=langSteps.map(function(step){
    var isDone=protoChecked[step.s];
    return '<div class="proto-step" onclick="toggleProtoStep(\''+step.s+'\')" style="cursor:pointer">'+
      '<div class="proto-check'+(isDone?' done':'')+(step.mandatory?' warn':'')+'"></div>'+
      '<div class="proto-step-text">'+
      '<div class="proto-step-label'+(isDone?' done-text':'')+'">'+ step.title+
      (step.mandatory?'<span class="proto-mandatory">'+labels.mandatory+'</span>':'')+
      '</div>'+
      (step.note?'<div class="proto-step-note">'+step.note+'</div>':'')+
      (step.law?'<div class="proto-step-law">'+step.law+'</div>':'')+
      '</div></div>';
  }).join('');

  var doneBanner=allMandatoryDone&&done===total?
    '<div class="proto-done-banner"><span class="done-icon">✅</span>'+
    '<div class="done-title">'+labels.done+'</div>'+
    '<div class="done-sub">'+labels.doneSub+'</div></div>':'';

  list.innerHTML='<div class="proto-container">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">'+
    '<button onclick="protoType=null;renderProtocol()" style="background:none;border:none;cursor:pointer;font-size:18px;padding:0;color:var(--color-text-secondary)">←</button>'+
    '<div style="font-size:15px;font-weight:600;color:var(--color-text-primary)">'+(typeInfo?typeInfo.icon+' ':'')+typeName+'</div>'+
    '</div>'+
    '<div class="proto-progress">'+
    '<div class="proto-progress-bar"><div class="proto-progress-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="proto-progress-text">'+done+'/'+total+' '+labels.progress+'</div>'+
    '<button class="proto-reset" onclick="event.stopPropagation();resetProto()">'+labels.reset+'</button>'+
    '</div>'+
    '<div class="proto-section">'+
    '<div class="proto-section-title">'+labels.checklist+'</div>'+
    stepsHtml+
    '</div>'+
    doneBanner+
    '</div>';
}

let compareSet=[];
let showingCompare=false;

const COMPARE_SVG='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>';

function isInCompare(article){return compareSet.some(function(c){return c.article===article;});}

function toggleCompare(article,lawType,catKey,name,event){
  event.stopPropagation();
  var idx=compareSet.findIndex(function(c){return c.article===article;});
  if(idx>=0){
    compareSet.splice(idx,1);
  } else {
    if(compareSet.length>=2){
      // Replace oldest
      compareSet.shift();
    }
    compareSet.push({article:article,law:lawType,cat:catKey,name:name});
  }
  updateCompareBar();
  // Re-render current view to update button state
  if(showingCompare){showCompare();return;}
  if(showingFavs){renderFavourites();return;}
  if(showingProto){return;}
  renderLaws(getLaws()[currentCat]);
}

function updateCompareBar(){
  var bar=document.getElementById('compareBar');
  var txt=document.getElementById('compareBarText');
  var btn=document.getElementById('compareBarBtn');
  if(!bar) return;
  var n=compareSet.length;
  var labels={
    lv:{none:'',one:'1 no 2 kartīņām atlasīta',two:'2 kartīņas atlasītas — gatavs salīdzināšanai',btnOne:'Izvēlies vēl 1',btnTwo:'Salīdzīnāt'},
    ru:{none:'',one:'1 из 2 карточек выбрано',two:'2 карточки выбраны — готово к сравнению',btnOne:'Выберите ещё 1',btnTwo:'Сравнить'},
    en:{none:'',one:'1 of 2 cards selected',two:'2 cards selected — ready to compare',btnOne:'Select 1 more',btnTwo:'Compare'}
  };
  var l=labels[lang]||labels.lv;
  if(n===0){
    bar.classList.remove('visible');
    return;
  }
  bar.classList.add('visible');
  txt.textContent=n===1?l.one:l.two;
  if(n>=2){
    btn.style.display='';
    btn.textContent=l.btnTwo;
  } else {
    btn.style.display='none';
  }
}

function clearCompare(){
  compareSet=[];
  updateCompareBar();
  if(showingCompare){exitCompare();}
  else if(!showingProto&&!showingFavs){renderLaws(getLaws()[currentCat]);}
}

function exitCompare(){
  showingCompare=false;
  var cats=document.getElementById('catGrid');
  if(cats) cats.style.display='';
  var sec=document.getElementById('sectionTitle');
  if(sec) sec.textContent=getCats()[currentCat]?getCats()[currentCat][lang].sec:'';
  document.getElementById('appSubtitle').textContent=getUI().subtitle;

function renderCompareCard(found){
  var law=found.law;
  var lawKey=found.lawKey;
  var lawLabels={asl:'ASL',csl:'CSN/CSL',aiz:'Aizturēšana',aal:'AAL',lpp:'LPP',apas:'APAS'};
  var t=getUIFor(lawKey);
  var srcUrl=law.srcRaw?law.srcRaw:(law.srcUrl==='AAL'?BASE_AAL:law.srcUrl==='LPP'?BASE_LPP:lawKey==='lpp'?BASE_LPP:lawKey==='aiz'?BASE_AAL:lawKey==='aal'?BASE_AAL:lawKey==='csl'?BASE_CSL:lawKey==='apas'?BASE_AAL:BASE_ASL);
  var maxStr=law.fineMax?law.fineMax[lang]:'';
  var maxBadge=maxStr.split('/')[0].trim();
  var ptsBadge=law.pts?'<span class="badge badge-pts">'+law.pts+' '+t.pts+'</span>':'';
  var signHTML=(law.signsSVG&&law.signsSVG.length)?'<div class="signs-row" style="flex-wrap:wrap;gap:6px">'+law.signsSVG.join('')+'</div>':'';
  var fineSection='';
  if(!law.noFine){
    if(law.singleFine){var fl={ru:'Штраф',lv:'Sods',en:'Fine'};fineSection='<div class="fine-row"><div class="fine-box"><div class="fine-lbl">'+fl[lang]+'</div><div class="fine-val danger">'+maxStr+'</div></div></div>';}
    else if(maxBadge){fineSection='<div class="fine-row"><div class="fine-box"><div class="fine-lbl">'+t.min+'</div><div class="fine-val">'+getFineMinFor(law)+'</div></div><div class="fine-box"><div class="fine-lbl">'+t.max+'</div><div class="fine-val danger">'+maxStr+'</div></div></div>';}
  }
  var bodyContent=signHTML+(law.parts?renderPartsHTMLFor(law,lawKey):'<div class="dl">'+t.desc+'</div><div class="dt">'+law[lang].desc+'</div>'+fineSection);
  if(law.csnRef) bodyContent+='<div class="csn-card-ref">'+csnLinks(law.csnRef)+'</div>';
  if(law.lawRefs) bodyContent+='<div class="csn-card-ref">'+lawBadges(law.lawRefs)+'</div>';
  if(t.howContest&&law[lang]&&law[lang].contest) bodyContent+='<div class="dl">'+t.howContest+'</div><div class="dt">'+law[lang].contest+'</div>';
  bodyContent+='<a class="source-btn" href="'+srcUrl+(law.anchor||'')+'" target="_blank" onclick="event.stopPropagation()">↗'+t.sourceBtn+'</a>';
  var metaBadges='<span class="fav-law-badge">'+lawLabels[lawKey]+'</span> ';
  if(law.warn) metaBadges+='<span class="badge badge-warn">'+t.warn+'</span>';
  if(!law.noFine&&maxBadge) metaBadges+='<span class="badge badge-fine">max '+maxBadge+'</span>';
  metaBadges+=ptsBadge+'<span class="badge badge-article">'+law.article+'</span>';

  return '<div class="compare-card">'+
    '<div class="compare-card-header">'+
    '<div class="compare-card-title">'+law[lang].name+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px">'+metaBadges+'</div>'+
    '</div>'+
    '<div class="compare-card-body">'+bodyContent+'</div>'+
    '</div>';
}

function showCompare(){
  if(compareSet.length<2) return;
  showingCompare=true;
  showingFavs=false;
  showingProto=false;
  document.getElementById('protocolBtn').classList.remove('active');

  var labels={
    lv:{title:'Salīdzīnāšana',exit:'← Atpakaļ',vs:'VS'},
    ru:{title:'Сравнение',exit:'← Назад',vs:'VS'},
    en:{title:'Comparison',exit:'← Back',vs:'VS'}
  }[lang]||{};

  var cats=document.getElementById('catGrid');
  if(cats){cats.innerHTML='';cats.style.display='none';}
  var sec=document.getElementById('sectionTitle');
  if(sec) sec.textContent='';
  document.getElementById('appSubtitle').textContent=labels.title||'';
  document.getElementById('appSubtitle2').textContent='';

  var list=document.getElementById('lawsList');
  if(!list) return;

  var cards=compareSet.map(function(fav){
    return findLawByArticle(fav.article);
  }).filter(Boolean);

  if(cards.length<2){list.innerHTML='<div style="padding:24px;text-align:center;color:var(--color-text-secondary)">Atlasi 2 kartiņas.</div>';return;}

  list.innerHTML=

// ===== THEME =====
const THEME_KEY='balt1_theme';

function getSystemTheme(){
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}

function applyTheme(theme){
  var html=document.documentElement;
  if(theme==='auto'){
    html.removeAttribute('data-theme');
  } else {
    html.setAttribute('data-theme',theme);
  }
  var isDark=(theme==='dark')||(theme==='auto'&&getSystemTheme()==='dark');
  var sun=document.getElementById('iconSun');
  var moon=document.getElementById('iconMoon');
  if(sun) sun.style.display=isDark?'block':'none';
  if(moon) moon.style.display=isDark?'none':'block';
  var btn=document.getElementById('themeToggleBtn');
  if(btn) btn.title=isDark?'Gaišā tēma':'Tumšā tēma';
}

function toggleTheme(){
  var html=document.documentElement;
  var current=html.getAttribute('data-theme')||'auto';
  var isDark=(current==='dark')||(current==='auto'&&getSystemTheme()==='dark');
  var next=isDark?'light':'dark';
  localStorage.setItem(THEME_KEY,next);
  applyTheme(next);
}

function initTheme(){
  var saved=localStorage.getItem(THEME_KEY)||'auto';
  applyTheme(saved);
  // Listen for OS theme changes (when in auto mode)
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
      if(!localStorage.getItem(THEME_KEY)||localStorage.getItem(THEME_KEY)==='auto'){
        applyTheme('auto');
      }
    });
  }
}

function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY)||'[]');}catch(e){return[];}}
function saveFavs(f){try{localStorage.setItem(FAV_KEY,JSON.stringify(f));}catch(e){}}
function isFav(article){return getFavs().some(function(f){return f.article===article;});}

function toggleFav(article,lawType,catKey,name,event){
  event.stopPropagation();
  var favs=getFavs();
  var idx=favs.findIndex(function(f){return f.article===article;});
  if(idx>=0){favs.splice(idx,1);}
  else{favs.push({article:article,law:lawType,cat:catKey,name:name});}
  saveFavs(favs);
  updateFavCount();
  // Re-render current view
  if(showingFavs){renderFavourites();}
  else{renderLaws(getLaws()[currentCat]);updateFavCount();initTheme();updateCompareBar();}
}

function updateFavCount(){
  var n=getFavs().length;
  var el=document.getElementById('favCount');
  var btn=document.getElementById('favTabBtn');
  if(el){el.textContent=n;el.style.display=n>0?'':'none';}

function getAllLaws(){
  return {asl:aslLaws,csl:cslLaws,aiz:aizLaws,aal:aalLaws,lpp:lppLaws};
}

function findLawByArticle(article){
  var all=getAllLaws();
  for(var lawKey in all){
    var sections=all[lawKey];
    for(var catKey in sections){
      var cards=sections[catKey];
      for(var i=0;i<cards.length;i++){
        if(cards[i].article===article){
          return{law:cards[i],lawKey:lawKey,catKey:catKey,idx:i};
        }
      }
    }
  }
  return null;
}

function renderFavourites(){
  var favs=getFavs();
  var list=document.getElementById('lawsList');
  var cats=document.getElementById('catGrid');
  var sec=document.getElementById('sectionTitle');
  if(cats)cats.innerHTML='';
  if(sec)sec.textContent='';

  if(!list)return;

  if(favs.length===0){
    var empty={ru:'Нет сохранённых статей. Нажмите ☆ на любой карточке, чтобы добавить в избранное.',lv:'Nav saglabātu kartiņu. Nospied ☆ uz jebkuras kartiņas, lai pievienotu favorītiem.',en:'No saved cards yet. Tap ☆ on any card to add it to favourites.'};

    return;
  }

  var lawLabels={asl:'ASL',csl:'CSL/CSN',aiz:'Aizturēšana',aal:'AAL',lpp:'LPP'};
  var items=[];
  favs.forEach(function(fav){
    var found=findLawByArticle(fav.article);
    if(found)items.push({law:found.law,lawKey:found.lawKey,catKey:found.catKey,idx:found.idx});
  });

  var prevLaw=null;
  list.innerHTML=items.map(function(item,i){
    var law=item.law;
    var maxStr=law.fineMax?law.fineMax[lang]:'';
    var maxBadge=maxStr.split('/')[0].trim();
    var ptsBadge=law.pts?'<span class="badge badge-pts">'+law.pts+' '+getUIFor(item.lawKey).pts+'</span>':'';
    var lawLabel=lawLabels[item.lawKey]||item.lawKey.toUpperCase();
    var t=getUIFor(item.lawKey);
    var signHTML=(law.signsSVG&&law.signsSVG.length)?'<div class="signs-row">'+law.signsSVG.join('')+'</div>':'';
    var fineSection='';
    if(!law.noFine){
      var fl={ru:'Штраф',lv:'Sods',en:'Fine'};
      if(law.singleFine){fineSection='<div class="fine-row"><div class="fine-box"><div class="fine-lbl">'+fl[lang]+'</div><div class="fine-val danger">'+maxStr+'</div></div></div>';}
      else if(maxBadge){fineSection='<div class="fine-row"><div class="fine-box"><div class="fine-lbl">'+t.min+'</div><div class="fine-val">'+getFineMinFor(law)+'</div></div><div class="fine-box"><div class="fine-lbl">'+t.max+'</div><div class="fine-val danger">'+maxStr+'</div></div></div>';}
    }
    var metaBadges='<span class="fav-law-badge">'+lawLabel+'</span> ';
    if(law.warn)metaBadges+='<span class="badge badge-warn">'+t.warn+'</span>';
    if(!law.noFine&&maxBadge)metaBadges+='<span class="badge badge-fine">max '+maxBadge+'</span>';
    metaBadges+=ptsBadge+'<span class="badge badge-article">'+law.article+'</span>';
    var detailContent=signHTML+(law.parts?renderPartsHTMLFor(law,item.lawKey):'<div class="dl">'+t.desc+'</div><div class="dt">'+law[lang].desc+'</div>'+fineSection);
    if(law.csnRef)detailContent+='<div class="csn-card-ref">'+csnLinks(law.csnRef)+'</div>';
    if(t.howContest&&law[lang]&&law[lang].contest)detailContent+='<div class="dl">'+t.howContest+'</div><div class="dt">'+law[lang].contest+'</div>';
    var srcUrl=law.srcUrl==='AAL'?BASE_AAL:law.srcUrl==='LPP'?BASE_LPP:item.lawKey==='lpp'?BASE_LPP:item.lawKey==='aiz'?BASE_LPP:item.lawKey==='aal'?BASE_AAL:item.lawKey==='csl'?BASE_CSL:BASE_ASL;

function toggleLaw(card,i){
  const d=document.getElementById('detail-'+i);
  const open=d.classList.contains('show');
  document.querySelectorAll('.law-detail').forEach(x=>x.classList.remove('show'));
  document.querySelectorAll('.law-card').forEach(x=>x.classList.remove('expanded'));
  if(!open){d.classList.add('show');card.classList.add('expanded');}
}

function getAllLawsFlat(){
  var all=[];
  var sections={asl:aslLaws,csl:cslLaws,aiz:aizLaws,aal:aalLaws,lpp:lppLaws,apas:apasLaws,btal:btalLaws,mmob:mmobLaws};
  for(var sk in sections){
    var sl=sections[sk];if(!sl)continue;
    for(var ck in sl){
      var arr=sl[ck];if(!Array.isArray(arr))continue;
      for(var idx=0;idx<arr.length;idx++) all.push({law:arr[idx],sectionKey:sk,catKey:ck,idx:idx});
    }
  }
  return all;
}

function filterLaws(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  var catGrid=document.getElementById('catGrid');
  var secTitle=document.getElementById('sectionTitle');
  var list=document.getElementById('lawsList');
  if(!q){
    if(catGrid&&!showingFavs&&!showingCompare&&!showingProto) catGrid.style.display='';
    if(secTitle&&!showingFavs&&!showingCompare&&!showingProto){
      secTitle.textContent=getCats()[currentCat]?getCats()[currentCat][lang].sec:'';
    }
    if(!showingFavs&&!showingCompare&&!showingProto) renderLaws(getLaws()[currentCat]);
    return;
  }
  if(showingFavs||showingCompare||showingProto) return;
  if(catGrid) catGrid.style.display='none';
  if(secTitle) secTitle.textContent='';

  var allFlat=getAllLawsFlat();
  var isNum=/^\d+$/.test(q);
  // Build a lookup for category names per section
  var catNameCache={};
  function getCatName(sk,ck){
    var key=sk+'|'+ck;
    if(catNameCache[key]!==undefined) return catNameCache[key];
    try{
      var origLaw2=currentLaw,origCat2=currentCat;
      currentLaw=sk;currentCat=ck;
      var cats=getCats();
      var n=(cats[ck]&&cats[ck][lang])?cats[ck][lang].name+' '+(cats[ck][lang].sec||''):'';
      currentLaw=origLaw2;currentCat=origCat2;
      catNameCache[key]=n.toLowerCase();
    }catch(e){catNameCache[key]=ck;}
    return catNameCache[key];
  }

  var sLblSearch={asl:'asl administrativo sodu',csl:'csl csn celu satiksmes',aiz:'aiztureshana aiztur',aal:'aal administrativas atbildibas',lpp:'lpp policija',apas:'apas pasvaldibas administrativie',btal:'btal bernu tiesibas nepilngadigo nepilngadigje',mmob:'mmob mikro mikromobilitāte'};

  var matched=allFlat.filter(function(item){
    var law=item.law;
    var ld=law[lang]||law.lv||{};
    var ldlv=law.lv||{};
    var ldru=law.ru||{};
    if(isNum){
      // Search in fine amounts
      var fm=(law.fineMax&&law.fineMax[lang])||'';
      var fmn=(law.fineMin&&law.fineMin[lang])||'';
      var fineMatch=(fm+' '+fmn).replace(/[^\d]/g,' ').split(/\s+/).some(function(n){return n&&parseInt(n)===parseInt(q);});
      if(fineMatch) return true;
      // Also search in article number — match "13" in "LPP 13.", "13.1.", "13.pants" etc.
      var artText=(law.article||'').replace(/[^\d.]/g,' ');
      var artMatch=artText.split(/[^\d]+/).some(function(n){return n&&parseInt(n)===parseInt(q);});
      if(artMatch) return true;
      // Also search in parts labels (for sub-article numbers like "13.(1)")
      var ld2=law[lang]||law.lv||{};
      if(ld2.parts) return ld2.parts.some(function(p){return (p.label||'').indexOf(q)>=0;});
      return false;
    }
    // Search across: article, all language names/descs, catKey, category name, section label
    var text=[
      law.article||'',
      ld.name||'', ldlv.name||'', ldru.name||'',
      ld.desc||'', ldlv.desc||'',
      law.csnRef||'',
      item.catKey,
      item.sectionKey,
      getCatName(item.sectionKey,item.catKey),
      (sLblSearch[item.sectionKey]||'')
    ].join(' ').toLowerCase();
    if(ld.parts) ld.parts.forEach(function(p){text+=' '+(p.label||'').toLowerCase()+' '+(p.desc||'').toLowerCase();});
    if(ldlv.parts) ldlv.parts.forEach(function(p){text+=' '+(p.label||'').toLowerCase()+' '+(p.desc||'').toLowerCase();});
    return text.indexOf(q)>=0;
  });

  var t=getUI();
  if(!matched.length){list.innerHTML='<p class="empty">'+t.empty+'</p>';return;}

  var cnt={lv:matched.length+' rezultāti',ru:matched.length+' результатов',en:matched.length+' results'}[lang]||matched.length+' results';
  var sLbl={asl:'ASL',csl:'CSN/CSL',aiz:'Aiztur.',aal:'AAL',lpp:'LPP',apas:'APAS',btal:'BTAL',mmob:'Mikro'};
  var origLaw=currentLaw,origCat=currentCat;

  var origLaw=currentLaw,origCat=currentCat;
  var _SR=[];  // global search result store for onclick refs

  function buildSearchCard(item,gi){
    currentLaw=item.sectionKey; currentCat=item.catKey;
    _SR[gi]=item;
    var t2=getUI();
    var law=item.law;
    var ld=law[lang]||law.lv||{};
    var maxStr=law.fineMax?(law.fineMax[lang]||''):'';
    var maxBadge=maxStr.split('/')[0].trim();
    var starCls=isFav(law.article)?'active':'';
    var cmpCls=isInCompare(law.article)?'active':'';

    var metaHtml='<span class="fav-law-badge">'+(sLbl[item.sectionKey]||item.sectionKey)+'</span> ';
    if(law.warn) metaHtml+='<span class="badge badge-warn">'+t2.warnWord+'</span> ';
    if(!law.noFine&&maxBadge) metaHtml+='<span class="badge badge-fine">max '+maxBadge+'</span> ';
    if(law.pts) metaHtml+='<span class="badge badge-pts">'+law.pts+' '+t2.pts+'</span> ';
    metaHtml+='<span class="badge badge-article">'+law.article+'</span>';

    var det='';
    if(law.signsSVG&&law.signsSVG.length) det+='<div class="signs-row">'+law.signsSVG.join('')+'</div>';
    if(law.parts&&ld.parts&&ld.parts.length){
