// ===== RENDERING FUNCTIONS =====
function getCats(){return currentLaw==='asl'?aslCats:cslCats;}
function getLaws(){return currentLaw==='asl'?aslLaws:cslLaws;}
function getUI(){return currentLaw==='asl'?aslUI[lang]:uiStrings.csl[lang];}
function getBase(){return currentLaw==='asl'?BASE_ASL:BASE_CSL;}

function setLaw(law,btn){
  currentLaw=law;
  document.querySelectorAll('.law-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentCat=Object.keys(getCats())[0];
  document.getElementById('appSubtitle').textContent=getUI().subtitle;
  document.getElementById('searchInput').placeholder=getUI().placeholder;
  document.getElementById('searchInput').value='';
  renderCats();
  document.getElementById('sectionTitle').textContent=getCats()[currentCat][lang].sec;
  renderLaws(getLaws()[currentCat]);
}

function setLang(l,btn){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('appSubtitle').textContent=getUI().subtitle;
  document.getElementById('searchInput').placeholder=getUI().placeholder;
  renderCats();
  document.getElementById('sectionTitle').textContent=getCats()[currentCat][lang].sec;
  document.getElementById('searchInput').value='';
  renderLaws(getLaws()[currentCat]);
}

function renderCats(){
  const cats=getCats();
  const aslIcons={admin:'ti-building-bank',order:'ti-shield',lang:'ti-language'};
  const aslCounts={admin:'ASL 3–8',order:'ASL 9–13.1',lang:'ASL 14–28'};
  const cslIcons={speed:'ti-gauge',parking:'ti-parking',alcohol:'ti-bottle',signals:'ti-traffic-lights',other:'ti-list-check'};
  const cslCounts={speed:'CSL 55. p.',parking:'CSL 57. p.',alcohol:'CSL 62. p.',signals:'CSN/CSL',other:'CSL 43–58. p.'};
  const icons=currentLaw==='asl'?aslIcons:cslIcons;
  const counts=currentLaw==='asl'?aslCounts:cslCounts;
  document.getElementById('catGrid').innerHTML=Object.keys(cats).map(k=>`
    <div class="cat-card${k===currentCat?' active':''}" onclick="selectCat(this,'${k}')">
      <i class="ti ${icons[k]} cat-icon" aria-hidden="true"></i>
      <div class="cat-name">${cats[k][lang].name}</div>
      <div class="cat-count">${counts[k]}</div>
    </div>`).join('');
}

function selectCat(el,cat){
  currentCat=cat;
  renderCats();
  document.getElementById('sectionTitle').textContent=getCats()[cat][lang].sec;
  document.getElementById('searchInput').value='';
  renderLaws(getLaws()[cat]);
}

function getFineMin(law){
  const t=getUI();
  return law.warnMin?t.warnWord:(law.fineMin||'—');
}

function renderPartsHTML(law){
  const t=getUI();
  const fl={ru:'Штраф',lv:'Sods',en:'Fine'};
  return law[lang].parts.map(p=>`
    <div class="part-block">
      <div class="part-label">${p.label}</div>
      ${p.desc?`<div class="part-desc">${p.desc}</div>`:''}
      <div class="part-fines">
        ${law.singleFine
          ?`<div class="part-fine-box" style="flex:none;min-width:80px"><div class="fine-lbl">${fl[lang]}</div><div class="fine-val danger">${p.fineMax}</div></div>`
          :`<div class="part-fine-box"><div class="fine-lbl">${t.min}</div><div class="fine-val">${p.fineMin}</div></div>
            <div class="part-fine-box"><div class="fine-lbl">${t.max}</div><div class="fine-val danger">${p.fineMax}</div></div>`}
      </div>
    </div>`).join('');
}

function renderLaws(items){
  const t=getUI();
  const list=document.getElementById('lawsList');
  if(!items||!items.length){list.innerHTML=`<p class="empty">${t.empty}</p>`;return;}
  list.innerHTML=items.map((law,i)=>{
    const maxStr=law.fineMax?law.fineMax[lang]:'—';
    const maxBadge=maxStr.split('/')[0].trim();
    const ptsBadge=law.pts?`<span class="badge badge-pts">${law.pts} ${t.pts}</span>`:'';
    const signHTML=(law.signsSVG&&law.signsSVG.length)
      ? `<div class="signs-row">${law.signsSVG.join('')}</div>`
      : '';
    return `<div class="law-card" onclick="toggleLaw(this,${i})">
      <div class="law-top">
        <div class="law-name">${law[lang].name}</div>
        <i class="ti ti-chevron-down arrow-icon" aria-hidden="true"></i>
      </div>
      <div class="law-meta">
        ${law.warn?`<span class="badge badge-warn">${t.warn}</span>`:''}
        <span class="badge badge-fine">max ${maxBadge}</span>
        ${ptsBadge}
        <span class="badge badge-article">${law.article}</span>
      </div>
      <div class="law-detail" id="detail-${i}">
        ${signHTML}
        ${law.parts?renderPartsHTML(law):`
          <div class="dl">${t.desc}</div>
          <div class="dt">${law[lang].desc}</div>
          ${law.singleFine
            ?`<div class="fine-row"><div class="fine-box"><div class="fine-lbl">${{ru:'Штраф',lv:'Sods',en:'Fine'}[lang]}</div><div class="fine-val danger">${maxStr}</div></div></div>`
            :`<div class="fine-row">
                <div class="fine-box"><div class="fine-lbl">${t.min}</div><div class="fine-val">${getFineMin(law)}</div></div>
                <div class="fine-box"><div class="fine-lbl">${t.max}</div><div class="fine-val danger">${maxStr}</div></div>
              </div>`}`}
        <div class="dl">${t.howContest}</div>
        <div class="dt">${law[lang].contest}</div>
        <a class="source-btn" href="${getBase()}${law.anchor}" target="_blank" onclick="event.stopPropagation()">
          <i class="ti ti-external-link" aria-hidden="true"></i>${t.sourceBtn}
        </a>
      </div>
    </div>`;
  }).join('');
}

function toggleLaw(card,i){
  const d=document.getElementById('detail-'+i);
  const open=d.classList.contains('show');
  document.querySelectorAll('.law-detail').forEach(x=>x.classList.remove('show'));
  document.querySelectorAll('.law-card').forEach(x=>x.classList.remove('expanded'));
  if(!open){d.classList.add('show');card.classList.add('expanded');}
}

function filterLaws(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  if(!q){renderLaws(getLaws()[currentCat]);return;}
  const all=Object.values(getLaws()).flat();
  renderLaws(all.filter(l=>
    l[lang].name.toLowerCase().includes(q)||
    l.article.toLowerCase().includes(q)
  ));
}

// ===== INIT =====
renderCats();
document.getElementById('appSubtitle').textContent=getUI().subtitle;
document.getElementById('searchInput').placeholder=getUI().placeholder;
document.getElementById('sectionTitle').textContent=getCats()[currentCat][lang].sec;
renderLaws(getLaws()[currentCat]);
</script>
