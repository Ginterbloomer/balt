function setLang(l,btn){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('appSubtitle').textContent=ui[l].subtitle;document.getElementById('searchInput').placeholder=ui[l].placeholder;renderCats();document.getElementById('sectionTitle').textContent=cats[currentCat][l].sec;document.getElementById('searchInput').value='';renderLaws(laws[currentCat]);}

function renderCats(){
  const icons={admin:'ti-building-bank',order:'ti-shield',lang:'ti-language'};
  const counts={admin:'ASL 3–8',order:'ASL 9–13.1',lang:'ASL 14–28'};
  document.getElementById('catGrid').innerHTML=Object.keys(cats).map(k=>`<div class="cat-card${k===currentCat?' active':''}" onclick="selectCat(this,'${k}')"><i class="ti ${icons[k]} cat-icon" aria-hidden="true"></i><div class="cat-name">${cats[k][lang].name}</div><div class="cat-count">${counts[k]}</div></div>`).join('');
}

function selectCat(el,cat){currentCat=cat;renderCats();document.getElementById('sectionTitle').textContent=cats[cat][lang].sec;document.getElementById('searchInput').value='';renderLaws(laws[cat]);}
function getFineMin(law){return law.warnMin?ui[lang].warnWord:(law.fineMin||'—');}

function renderPartsHTML(law){
  return law[lang].parts.map(p=>`
    <div class="part-block">
      <div class="part-label">${p.label}</div>
      <div class="part-desc">${p.desc}</div>
      <div class="part-fines">
        <div class="part-fine-box"><div class="fine-lbl">${ui[lang].min}</div><div class="fine-val">${p.fineMin}</div></div>
        <div class="part-fine-box"><div class="fine-lbl">${ui[lang].max}</div><div class="fine-val danger">${p.fineMax}</div></div>
      </div>
    </div>`).join('');
}

function renderLaws(items){
  const t=ui[lang];
  const list=document.getElementById('lawsList');
  if(!items||!items.length){list.innerHTML=`<p class="empty">${t.empty}</p>`;return;}
  list.innerHTML=items.map((law,i)=>`
    <div class="law-card" onclick="toggleLaw(this,${i})">
      <div class="law-top"><div class="law-name">${law[lang].name}</div><i class="ti ti-chevron-down arrow-icon" aria-hidden="true"></i></div>
      <div class="law-meta">
        ${law.warn?`<span class="badge badge-warn">${t.warn}</span>`:''}
        <span class="badge badge-fine">max ${law.fineMax[lang].split('/')[0].trim()}</span>
        <span class="badge badge-article">${law.article}</span>
      </div>
      <div class="law-detail" id="detail-${i}">
        ${law.parts?renderPartsHTML(law):`
          <div class="dl">${t.desc}</div>
          <div class="dt">${law[lang].desc}</div>
          <div class="fine-row">
            <div class="fine-box"><div class="fine-lbl">${t.min}</div><div class="fine-val">${getFineMin(law)}</div></div>
            <div class="fine-box"><div class="fine-lbl">${t.max}</div><div class="fine-val danger">${law.fineMax[lang]}</div></div>
          </div>`}
        <div class="dl">${t.howContest}</div>
        <div class="dt">${law[lang].contest}</div>
        <a class="source-btn" href="${BASE}${law.anchor}" onclick="event.stopPropagation()">
          <i class="ti ti-external-link" aria-hidden="true"></i>${t.sourceBtn}
        </a>
      </div>
    </div>`).join('');
}

function toggleLaw(card,i){const d=document.getElementById('detail-'+i);const open=d.classList.contains('show');document.querySelectorAll('.law-detail').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.law-card').forEach(x=>x.classList.remove('expanded'));if(!open){d.classList.add('show');card.classList.add('expanded');}}

function filterLaws(){const q=document.getElementById('searchInput').value.toLowerCase();if(!q){renderLaws(laws[currentCat]);return;}const all=Object.values(laws).flat();renderLaws(all.filter(l=>l[lang].name.toLowerCase().includes(q)||l.article.toLowerCase().includes(q)));}

renderCats();
document.getElementById('sectionTitle').textContent=cats[currentCat][lang].sec;
renderLaws(laws[currentCat]);
</script>
